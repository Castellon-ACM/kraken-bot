name: bot

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kraken-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Ejecutar bot
        run: python bot.py
        env:
          KRAKEN_ENV: live
          CONFIRMO_DINERO_REAL: si
          KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
          KRAKEN_API_SECRET: ${{ secrets.KRAKEN_API_SECRET }}
      - name: Guardar estado
        if: always()
        run: |
          git config user.name "kraken-bot"
          git config user.email "kraken-bot@users.noreply.github.com"
          git add state.json status.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q -m "estado $(date -u +%H:%M)"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 3; done
          fi
